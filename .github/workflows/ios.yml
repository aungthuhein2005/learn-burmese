name: iOS build & TestFlight

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile check on every push / PR (no signing, no secrets needed).
  build:
    runs-on: macos-15
    env:
      BUNDLE_ID: com.example.kagyi
      APPLE_TEAM_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project KaGyi.xcodeproj -scheme KaGyi -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 80

  # Cloud-managed signing with an App Store Connect API key (same setup as palm-note).
  # Run by hand: Actions > iOS build & TestFlight > Run workflow.
  #
  # Repository secrets: APPLE_TEAM_ID, APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_PRIVATE_KEY
  # Repository variable (optional): BUNDLE_ID, defaults to com.aungthuhein.kagyi
  testflight:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.aungthuhein.kagyi' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check secrets and write API key
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          for v in APPLE_TEAM_ID KEY_ID ISSUER_ID PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          # Strip stray spaces/newlines pasted into the secrets.
          for v in APPLE_TEAM_ID KEY_ID ISSUER_ID; do
            clean=$(printf '%s' "${!v}" | tr -d '[:space:]')
            echo "::add-mask::$clean"
            echo "$v=$clean" >> "$GITHUB_ENV"
          done
          printf '%s\n' "$PRIVATE_KEY" | tr -d '\r' > "$RUNNER_TEMP/AuthKey.p8"

      # Fails early with a clear message if the key/issuer don't match or the app is missing.
      - name: Verify App Store Connect API key
        run: |
          pip install -q pyjwt cryptography
          python - <<'PY'
          import json, os, sys, time, urllib.error, urllib.parse, urllib.request
          import jwt
          key = open(os.path.join(os.environ["RUNNER_TEMP"], "AuthKey.p8")).read()
          if "BEGIN PRIVATE KEY" not in key:
              sys.exit("::error::APPSTORE_PRIVATE_KEY must be the full .p8 text including the BEGIN/END PRIVATE KEY lines")
          now = int(time.time())
          try:
              token = jwt.encode({"iss": os.environ["ISSUER_ID"], "iat": now, "exp": now + 600, "aud": "appstoreconnect-v1"},
                                 key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          except Exception as e:
              sys.exit(f"::error::APPSTORE_PRIVATE_KEY could not be read as a .p8 key: {e}")
          bundle = os.environ["BUNDLE_ID"]
          url = "https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=" + urllib.parse.quote(bundle)
          req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
          try:
              data = json.load(urllib.request.urlopen(req))
          except urllib.error.HTTPError as e:
              if e.code == 401:
                  sys.exit("::error::Apple rejected the API key (401). APPSTORE_KEY_ID and APPSTORE_ISSUER_ID must belong to the same key as APPSTORE_PRIVATE_KEY.")
              if e.code == 403:
                  sys.exit("::error::API key has no access (403). Give the key the App Manager or Admin role.")
              sys.exit(f"::error::App Store Connect API error {e.code}: {e.read().decode()[:300]}")
          if not data.get("data"):
              sys.exit(f"::error::API key works, but no app with bundle ID {bundle} exists in App Store Connect. Create it under Apps > +.")
          print(f"API key OK; found app for {bundle}")
          PY

      - name: Cache converted model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: KaGyi/Resources/model_fp16.onnx
          key: model-fp16-${{ hashFiles('scripts/prepare_model.py') }}

      - name: Download & convert model (fp16)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          pip install onnx onnxruntime onnxconverter-common numpy
          python scripts/prepare_model.py KaGyi/Resources/model_fp16.onnx

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # Archive unsigned: automatic signing at archive time wants a development profile,
      # which needs a registered device. Export signs for App Store with cloud-managed certs.
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project KaGyi.xcodeproj -scheme KaGyi -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KaGyi.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      # onnxruntime 1.20 is a static library already linked into the app, but Xcode still
      # embeds a copy that App Store validation rejects (bad signature, no MinimumOSVersion).
      # Drop every embedded framework the app binary does not link; patch the rest.
      - name: Clean up embedded frameworks
        run: |
          APP=$(echo "$RUNNER_TEMP"/KaGyi.xcarchive/Products/Applications/*.app)
          EXE="$APP/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")"
          echo "App links:"; otool -L "$EXE" | sed 1d
          [ -d "$APP/Frameworks" ] || exit 0
          for fw in "$APP"/Frameworks/*.framework; do
            [ -e "$fw" ] || continue
            name=$(basename "$fw" .framework)
            echo "--- $name.framework"; file "$fw/$name" || true
            if otool -L "$EXE" | grep -q "/$name.framework/"; then
              echo "linked dynamically: keeping, setting MinimumOSVersion"
              /usr/libexec/PlistBuddy -c "Delete :MinimumOSVersion" "$fw/Info.plist" 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Add :MinimumOSVersion string 16.0" "$fw/Info.plist"
            else
              echo "not linked by the app: removing"
              rm -rf "$fw"
            fi
          done
          rmdir "$APP/Frameworks" 2>/dev/null || true

      - name: Export & upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KaGyi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | tee export.log
          echo "Uploaded build $BUILD_NUMBER. It appears in TestFlight after Apple finishes processing."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore

      - name: Remove API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
