name: iOS build & TestFlight

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compile check on every push / PR (no signing, no secrets needed).
  build:
    runs-on: macos-15
    env:
      BUNDLE_ID: com.example.kagyi
      APPLE_TEAM_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project KaGyi.xcodeproj -scheme KaGyi -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 80

  # Cloud-managed signing with an App Store Connect API key (same setup as palm-note).
  # Run by hand: Actions > iOS build & TestFlight > Run workflow.
  #
  # Repository secrets: APPLE_TEAM_ID, APPSTORE_KEY_ID, APPSTORE_ISSUER_ID, APPSTORE_PRIVATE_KEY
  # Repository variable (optional): BUNDLE_ID, defaults to com.aungthuhein.kagyi
  testflight:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: macos-15
    timeout-minutes: 45
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'com.aungthuhein.kagyi' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check secrets and write API key
        env:
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          for v in APPLE_TEAM_ID KEY_ID ISSUER_ID PRIVATE_KEY; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v"; exit 1; fi
          done
          printf '%s\n' "$PRIVATE_KEY" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Cache converted model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: KaGyi/Resources/model_fp16.onnx
          key: model-fp16-${{ hashFiles('scripts/prepare_model.py') }}

      - name: Download & convert model (fp16)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          pip install onnx onnxruntime onnxconverter-common numpy
          python scripts/prepare_model.py KaGyi/Resources/model_fp16.onnx

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # Archive unsigned: automatic signing at archive time wants a development profile,
      # which needs a registered device. Export signs for App Store with cloud-managed certs.
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project KaGyi.xcodeproj -scheme KaGyi -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/KaGyi.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      - name: Export & upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/KaGyi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            | tee export.log
          echo "Uploaded build $BUILD_NUMBER. It appears in TestFlight after Apple finishes processing."

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
          if-no-files-found: ignore

      - name: Remove API key file
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
