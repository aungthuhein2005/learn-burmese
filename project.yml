# XcodeGen spec — `xcodegen generate` creates KaGyi.xcodeproj (done in CI).
# BUNDLE_ID, APPLE_TEAM_ID and PROFILE_NAME come from the environment;
# the TestFlight workflow reads them out of your provisioning profile.
name: KaGyi
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  onnxruntime:
    url: https://github.com/microsoft/onnxruntime-swift-package-manager
    from: 1.20.0

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"

targets:
  KaGyi:
    type: application
    platform: iOS
    sources:
      - path: KaGyi
    dependencies:
      - package: onnxruntime
        product: onnxruntime
    info:
      path: KaGyi/Info.plist
      properties:
        CFBundleDisplayName: KaGyi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: AccentColor
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "${BUNDLE_ID}"
        DEVELOPMENT_TEAM: "${APPLE_TEAM_ID}"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "${PROFILE_NAME}"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  KaGyi:
    build:
      targets:
        KaGyi: all
    run:
      config: Debug
    archive:
      config: Release
